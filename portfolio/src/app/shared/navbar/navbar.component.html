<!-- Sticky Navigation Bar -->
<mat-toolbar color="primary" class="navbar">
  <div class="navbar-container">
    <!-- Logo/Brand -->
    <a (click)="scrollToSection('home')" class="brand" style="cursor: pointer;">
      <span class="brand-name">SK</span>
      <span class="brand-text">Shubham Khobragade</span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="desktop-nav">
      <button 
        *ngFor="let link of navLinks" 
        (click)="scrollToSection(link.section)"
        mat-button
        class="nav-link"
      >
        <i class="bi" [ngClass]="link.icon" aria-hidden="true"></i>
        {{ link.label }}
      </button>
    </nav>

    <!-- Theme Toggle -->
    <button 
      mat-icon-button 
      (click)="toggleTheme()" 
      class="theme-toggle"
      [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      <i class="bi" [ngClass]="isDarkMode() ? 'bi-sun-fill' : 'bi-moon-fill'" aria-hidden="true"></i>
    </button>

    <!-- Mobile Menu Button -->
    <button 
      mat-icon-button 
      class="mobile-menu-btn" 
      [matMenuTriggerFor]="mobileMenu"
      aria-label="Open menu"
    >
      <i class="bi bi-list" aria-hidden="true"></i>
    </button>
  </div>
</mat-toolbar>

<!-- Mobile Menu -->
<mat-menu #mobileMenu="matMenu" class="mobile-menu">
  <button 
    *ngFor="let link of navLinks" 
    (click)="scrollToSection(link.section)"
    mat-menu-item
    class="mobile-nav-link"
  >
    <i class="bi" [ngClass]="link.icon" aria-hidden="true"></i>
    <span>{{ link.label }}</span>
  </button>
</mat-menu>
