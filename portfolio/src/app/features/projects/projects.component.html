<!-- Projects Page -->
<div class="projects-page">
  <!-- Page Header -->
  <section class="page-header">
    <div class="container">
      <h1 class="section-title fade-in">My Projects</h1>
      <p class="section-subtitle fade-in">
        Enterprise applications I've developed using ASP.NET Core, Angular, and modern technologies
      </p>
    </div>
  </section>

  <!-- Projects Grid -->
  <section class="section">
    <div class="container">
      <div class="projects-grid" *ngIf="projects.length > 0">
        <mat-card class="project-card fade-in" *ngFor="let project of projects">
          <!-- Project Header -->
          <mat-card-header>
            <div mat-card-avatar class="project-icon">
              <mat-icon>folder_special</mat-icon>
            </div>
            <mat-card-title>{{ project.name }}</mat-card-title>
          </mat-card-header>

          <!-- Project Content -->
          <mat-card-content>
            <p class="project-description">{{ project.description }}</p>

            <!-- Features List -->
            <div class="features-section" *ngIf="project.features && project.features.length > 0">
              <h4>Key Features:</h4>
              <ul class="features-list">
                <li *ngFor="let feature of project.features">
                  <mat-icon>check_circle</mat-icon>
                  <span>{{ feature }}</span>
                </li>
              </ul>
            </div>

            <!-- Technologies Used -->
            <div class="tech-stack">
              <h4>Technologies:</h4>
              <mat-chip-set>
                <mat-chip *ngFor="let tech of project.technologies">
                  {{ tech }}
                </mat-chip>
              </mat-chip-set>
            </div>
          </mat-card-content>

          <!-- Project Actions -->
          <mat-card-actions>
            <button mat-button color="primary" *ngIf="project.link">
              <mat-icon>open_in_new</mat-icon>
              View Project
            </button>
            <button mat-button>
              <mat-icon>info</mat-icon>
              Learn More
            </button>
          </mat-card-actions>
        </mat-card>
      </div>

      <!-- Empty State -->
      <div class="empty-state" *ngIf="projects.length === 0">
        <mat-icon>folder_open</mat-icon>
        <h3>No Projects Yet</h3>
        <p>Check back soon for updates!</p>
      </div>
    </div>
  </section>
</div>
